apiVersion: apps/v1
kind: Deployment
metadata:
  name: lab-system
  namespace: production
  labels:
    app: lab-system
    version: v1
spec:
  # 副本数，至少2个保证高可用
  replicas: 3
  selector:
    matchLabels:
      app: lab-system
  # 滚动更新策略
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1        # 最多超出期望副本数1个
      maxUnavailable: 0  # 期望副本数不能低于
  template:
    metadata:
      labels:
        app: lab-system
        version: v1
    spec:
      # 调度策略 - 反亲和性
      affinity:
        # 防止Pod调度到同一节点
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector:
                matchLabels:
                  app: lab-system
              topologyKey: kubernetes.io/hostname
        # 拓扑分布，跨可用区
        topologySpreadConstraints:
          - maxSkew: 1
            topologyKey: topology.kubernetes.io/zone
            whenUnsatisfiable: DoNotSchedule
            labelSelector:
              matchLabels:
                app: lab-system
      containers:
        - name: lab-system
          image: lab-system:1.0.0
          ports:
            - containerPort: 8080
          # 资源限制
          resources:
            requests:
              cpu: "500m"
              memory: "512Mi"
            limits:
              cpu: "2000m"
              memory: "2Gi"
          # 健康检查
          livenessProbe:
            httpGet:
              path: /actuator/health
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 10
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 5
            failureThreshold: 3
          env:
            - name: SPRING_PROFILES_ACTIVE
              value: "production"