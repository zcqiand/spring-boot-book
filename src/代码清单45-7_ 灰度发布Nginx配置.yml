upstream lab_backend {
    server lab-v1:8080;    # 稳定版本
    server lab-v2:8080;    # 新版本
}

server {
    listen 80;

    # 根据客户端IP进行灰度分流
    geo $variant {
        default         v1;
        10.0.0.0/8      v2;  # 内网IP走新版本
        192.168.0.0/16  v2;  # 办公网走新版本
    }

    server_name lab.example.com;

    location / {
        proxy_pass http://lab_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Variant $variant;
    }
}