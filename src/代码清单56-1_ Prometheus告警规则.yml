groups:
  - name: lab-system-alerts
    rules:
      # 服务不可用告警
      - alert: ServiceDown
        expr: up{job="lab-system"} == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "服务实例 {{ $labels.instance }} 不可用"
          description: "服务实例已停止响应超过1分钟"

      # CPU使用率过高告警
      - alert: HighCPUUsage
        expr: sum(rate(process_cpu_seconds_total{job="lab-system"}[5m])) by (instance) * 100 > 80
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "CPU使用率过高"
          description: "实例 {{ $labels.instance }} CPU使用率超过80%，当前值: {{ $value }}%"

      # 内存使用率过高告警
      - alert: HighMemoryUsage
        expr: (jvm_memory_used_bytes{job="lab-system", area="heap"} / jvm_memory_max_bytes{job="lab-system", area="heap"}) * 100 > 85
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "JVM堆内存使用率过高"
          description: "实例 {{ $labels.instance }} 堆内存使用率超过85%，当前值: {{ $value }}%"

      # 错误率过高告警
      - alert: HighErrorRate
        expr: sum(rate(http_server_requests_seconds_count{job="lab-system", status=~"5.."}[5m])) / sum(rate(http_server_requests_seconds_count{job="lab-system"}[5m])) * 100 > 1
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "HTTP错误率过高"
          description: "服务5xx错误率超过1%，当前值: {{ $value }}%"

      # 响应时间过长告警
      - alert: HighResponseTime
        expr: histogram_quantile(0.95, sum(rate(http_server_requests_seconds_bucket{job="lab-system"}[5m])) by (le)) > 2
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "响应时间过长"
          description: "P95响应时间超过2秒，当前值: {{ $value }}秒"