apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: lab-system-hpa
  namespace: production
spec:
  # HPA作用的Scale目标
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: lab-system
  # 副本数范围
  minReplicas: 2
  maxReplicas: 10
  # 扩容指标
  metrics:
    # CPU使用率
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
    # 内存使用率
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80
  # 扩容行为策略
  behavior:
    scaleUp:
      # 扩容冷却时间
      stabilizationWindowSeconds: 300
      policies:
        - type: Percent
          value: 100
          periodSeconds: 60
    scaleDown:
      # 缩容冷却时间，防止抖动
      stabilizationWindowSeconds: 300
      policies:
        - type: Percent
          value: 10
          periodSeconds: 60