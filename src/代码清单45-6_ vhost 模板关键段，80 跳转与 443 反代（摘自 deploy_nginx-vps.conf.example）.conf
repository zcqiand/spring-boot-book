server {
    listen 80;
    server_name lab.YOUR_DOMAIN;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name lab.YOUR_DOMAIN;

    ssl_certificate     /etc/nginx/ssl/your-cert.cert;
    ssl_certificate_key /etc/nginx/ssl/your-cert.key;
    # 中略：ssl_session_cache 与 ssl_session_timeout 两行，见源文件
    ssl_protocols       TLSv1.2 TLSv1.3;
    # 中略：ssl_ciphers 与 ssl_prefer_server_ciphers 两行，见源文件

    add_header Strict-Transport-Security "max-age=31536000" always;

    location / {
        proxy_pass http://127.0.0.1:5205;
        # 中略：proxy_http_version 1.1，见源文件
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}