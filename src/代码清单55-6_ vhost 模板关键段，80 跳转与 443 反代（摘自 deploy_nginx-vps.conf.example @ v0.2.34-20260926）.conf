server {
    listen 80;
    server_name saas.YOUR_DOMAIN;             # 改:你的 saas 域名
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name saas.YOUR_DOMAIN;             # 改

    # cert / key 在 VPS 本地，**不入仓**
    ssl_certificate     /etc/nginx/ssl/your-cert.cert;   # 改
    ssl_certificate_key /etc/nginx/ssl/your-cert.key;    # 改

    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    # 浏览器一年 HTTPS-only
    add_header Strict-Transport-Security "max-age=31536000" always;

    location / {
        # VPS 暴露端口（容器内 Spring Boot 监听 :5105，host=container=5105）
        # 改端口必须同步 deploy/saas-identity-platform-springboot.sh 的 -p 与 application.yml server.port
        proxy_pass http://127.0.0.1:5105;

        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Spring Boot 默认不开 WebSocket；如有 OAuth2 callback 走 SSE/WS, 再开 Upgrade/Connection map.
    }
}