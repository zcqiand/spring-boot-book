global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: 'lab-system'
    metrics_path: '/actuator/prometheus'
    static_configs:
      - targets: ['lab-system:8080']
        labels:
          app: 'lab-system'
          environment: 'production'

  - job_name: 'docker'
    static_configs:
      - targets: ['cadvisor:8080']
        labels:
          app: 'cadvisor'