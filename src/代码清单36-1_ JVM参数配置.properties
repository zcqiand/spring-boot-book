# JVM堆内存设置
# 初始堆大小
-Xms512m
# 最大堆大小
-Xmx1024m
# 年轻代大小（推荐为堆的1/3到1/4）
-Xmn256m
# 使用G1垃圾收集器（适合低延迟场景）
-XX:+UseG1GC
# 设置GC目标停顿时间（毫秒）
-XX:MaxGCPauseMillis=200
# 并行GC线程数
-XX:ParallelGCThreads=4
# 元空间大小（替代永久代）
-XX:MaxMetaspaceSize=256m
# 使用指针压缩减少内存占用
-XX:+UseCompressedOops
# 启用类数据共享
-XX:+UseClassFlattening
# 记录GC日志
-Xlog:gc*:file=logs/gc.log:time:filecount=5,filesize=10M
# 启用JFR（Java Flight Recorder）
-XX:+UnlockCommercialFeatures
-XX:+FlightRecorder
# JFR记录配置
-XX:StartFlightRecording=delay=60s,duration=300s,filename=logs/jfr dump.jfr,settings=profile