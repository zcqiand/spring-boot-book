<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>WebSocket实时聊天</title>
    <script src="https://cdn.jsdelivr.net/npm/sockjs-client@1.6.1/dist/sockjs.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@stomp/stompjs@7.0.0/bundles/stomp.umd.min.js"></script>
</head>
<body>
    <h1>WebSocket实时通信演示</h1>

    <div id="status">状态：未连接</div>

    <div id="loginPanel">
        <input type="text" id="username" placeholder="输入用户名" value="user1">
        <button onclick="connect()">连接</button>
    </div>

    <div id="chatPanel" style="display:none;">
        <h3>系统公告</h3>
        <div id="broadcastList" style="border:1px solid #ccc;padding:10px;height:150px;overflow-y:auto;"></div>
        <input type="text" id="broadcastInput" placeholder="发送广播...">
        <button onclick="sendBroadcast()">发送</button>

        <h3>私信</h3>
        <select id="recipient">
            <option value="">选择用户</option>
            <option value="user1">user1</option>
            <option value="user2">user2</option>
        </select>
        <input type="text" id="privateInput" placeholder="发送私信...">
        <button onclick="sendPrivate()">发送</button>
        <div id="privateList" style="border:1px solid #ccc;padding:10px;height:150px;overflow-y:auto;"></div>
    </div>

    <script th:inline="javascript">
        let stompClient = null;

        function connect() {
            const username = document.getElementById('username').value;
            if (!username) { alert('请输入用户名'); return; }

            const socket = new SockJS('/ws');
            stompClient = Stomp.over(socket);
            stompClient.debug = function() {};

            stompClient.connect(
                { username: username },
                function() {
                    document.getElementById('status').textContent = '已连接：' + username;
                    document.getElementById('loginPanel').style.display = 'none';
                    document.getElementById('chatPanel').style.display = 'block';

                    // 订阅广播
                    stompClient.subscribe('/topic/notifications', function(msg) {
                        appendMessage('broadcastList', '【广播】', msg.body);
                    });

                    // 订阅私信
                    stompClient.subscribe('/user/queue/messages', function(msg) {
                        const msgObj = JSON.parse(msg.body);
                        appendMessage('privateList', '【' + msgObj.sender + '】', msgObj.content);
                    });
                },
                function(err) {
                    document.getElementById('status').textContent = '连接失败';
                    console.error(err);
                }
            );
        }

        function sendBroadcast() {
            const content = document.getElementById('broadcastInput').value;
            if (!content) return;
            stompClient.send('/app/notification', {}, JSON.stringify({ content: content }));
            document.getElementById('broadcastInput').value = '';
        }

        function sendPrivate() {
            const recipient = document.getElementById('recipient').value;
            const content = document.getElementById('privateInput').value;
            if (!recipient || !content) return;
            const username = document.getElementById('username').value;
            stompClient.send('/app/chat.private', {}, JSON.stringify({
                sender: username,
                recipient: recipient,
                content: content
            }));
            document.getElementById('privateInput').value = '';
        }

        function appendMessage(listId, sender, content) {
            const list = document.getElementById(listId);
            list.innerHTML += '<div>' + sender + '：' + content + '</div>';
            list.scrollTop = list.scrollHeight;
        }
    </script>
</body>
</html>
